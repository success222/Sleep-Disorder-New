<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        .result-container {
            max-width: 760px;
            margin: 50px auto;
            background: #fff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
        }

        h1 {
            color: #0f172a;
            margin-top: 0;
        }

        .result-box {
            padding: 18px;
            border-radius: 10px;
            margin: 20px 0;
            background: #eff6ff;
            border-left: 6px solid #2563eb;
        }

        p {
            line-height: 1.7;
            color: #475569;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn {
            background: #2563eb;
            color: white;
        }

        .predict-btn {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h1>Prediction Result</h1>

        <div class="result-box">
            <h2>{{ heading }}</h2>
        </div>

        <p>{{ explanation }}</p>
        <p><strong>What you can do:</strong></p>
        <p>{{ advice }}</p>

        <div class="button-group">
            <a href="{{ url_for('index') }}" class="home-btn">Back to Home</a>
            <a href="{{ url_for('predict_datapoint') }}" class="predict-btn">Make Another Prediction</a>
        </div>
    </div>
</body>
</html>
